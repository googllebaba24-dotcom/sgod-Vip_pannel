<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: rgba(0, 0, 0, 0.85); 
            color: #00ff00; 
            font-family: monospace; 
            padding: 15px; 
            margin: 0; 
            border: 2px solid #00ff00;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
        .title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 5px #00ff00; }
        .box { border: 1px dashed #00ff00; padding: 15px; text-align: center; margin-bottom: 15px; }
        .result { font-size: 28px; font-weight: bold; color: yellow; margin-top: 10px; }
        button { 
            background: #00ff00; color: #000; border: none; padding: 12px; 
            width: 100%; font-weight: bold; font-size: 16px; 
            border-radius: 5px; margin-bottom: 10px; box-shadow: 0 0 5px #00ff00;
        }
        button:active { background: #00cc00; }
        .close-btn { background: red; color: white; border: 1px solid white; box-shadow: 0 0 5px red; }
    </style>
</head>
<body>
    <div class="title">🔥 SGOD VIP 🔥</div>
    <div class="box">
        <div>Server: <span style="color: yellow;">CONNECTED</span></div>
        <div style="margin-top: 10px; font-size: 14px;">NEXT PREDICTION:</div>
        <div class="result" id="prediction">WAITING...</div>
    </div>
    
    <button onclick="getPrediction()">GET PREDICTION</button>
    <button class="close-btn" onclick="Android.closePanel()">CLOSE PANEL</button>

    <script>
        function getPrediction() {
            // Yahan aap apna original prediction logic daal sakte hain
            const results = ["BIG", "SMALL", "BIG", "SMALL"];
            const random = results[Math.floor(Math.random() * results.length)];
            
            document.getElementById('prediction').innerText = "CALCULATING...";
            document.getElementById('prediction').style.color = "white";
            
            setTimeout(() => {
                document.getElementById('prediction').innerText = random;
                document.getElementById('prediction').style.color = "yellow";
            }, 1000);
        }
    </script>
</body>
</html>
